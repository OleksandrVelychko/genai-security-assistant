[project]
name = "genai-security-assistant"
version = "0.1.0"
description = "Agentic RAG assistant for GenAI and LLM application security, grounded in OWASP sources"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
     # HW2: semantic retrieval layer
    "faiss-cpu>=1.14.3",
    "numpy>=2.1.0",
    "openai>=2.0.0",
    "python-dotenv>=1.0.1",
    # HW3: keyword half of the hybrid search
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
local-embeddings = [
    "sentence-transformers>=5.0.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "C4", "FURB"]