# Base configuration for the GenAI Security Assistant knowledge base.
# Drives the ingestion pipeline: raw -> normalized -> chunks.

project:
  name: "genai-security-assistant"
  language: "en"
  domain: "genai_security"

paths:
  raw_dir: "data/raw"
  normalized_dir: "data/normalized"
  processed_dir: "data/processed"
  sources_manifest: "configs/sources.yaml"
  normalized_documents: "data/normalized/documents.jsonl"
  chunks: "data/processed/chunks.jsonl"
  # HW2
  index_dir: "index"
  faiss_index: "index/faiss.index"
  index_chunks: "index/chunks.jsonl"
  index_meta: "index/index_meta.json"
  eval_queries: "configs/eval_queries.yaml"
  retrieval_examples: "outputs/retrieval_examples.md"
  conclusions: "configs/conclusions.md"
  # HW3
  query_vectors: "index/query_vectors.npz"
  retrieval_comparison: "outputs/retrieval_comparison.md"
  comparison_conclusions: "configs/comparison_conclusions.md"
  # HW4
  answers_cache: "index/answers_cache.json"
  qa_questions: "configs/qa_questions.yaml"
  rag_answers_examples: "outputs/rag_answers_examples.md"
  prompt_improvements: "outputs/rag_prompt_improvements.md"
  answer_conclusions: "configs/answer_conclusions.md"

chunking:
  chunk_size: 700          # target characters (assignment range: 500-1000)
  chunk_overlap: 150       # overlap characters (assignment range: 100-200)
  min_chunk_size: 200      # merge/discard fragments smaller than this
  strategy: "structure_aware"   # split on headings/paragraphs, snap to sentences

embeddings:
  provider: "openai" # openai | sentence_transformers
  openai:
#  replace with this to switch to openrouter
#   model: "openai/text-embedding-3-small"
#   base_url: "https://openrouter.ai/api/v1"
#   api_key_env: "OPENROUTER_API_KEY"
#   replace model to "text-embedding-3-large" to see fail fast principle in action
    model: "text-embedding-3-small"
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
    batch_size: 64
  sentence_transformers:
    model: "sentence-transformers/all-MiniLM-L6-v2"
    batch_size: 32

generation:
  provider: "openai"
  openai:
    model: "gpt-4.1-mini"
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
  # 0 asks for the least random answer the API will give. It doesn't make
  # the answer repeatable - the same call twice can still differ - which is
  # why answers are cached to disk as well.
  temperature: 0
  max_output_tokens: 600
  prompt_version: "v3"
  # Read answers from index/answers_cache.json when they are there.
  # scripts/rag_answer.py --live overrides this for one run.
  use_cached_answers: true

retrieval:
  top_k: 5
  score_precision: 4
  preview_chars: 300
  # HW3
  # How many candidates to fetch before filtering, as a multiple of top_k.
  # Filtering can only remove what the search already returned, so five
  # results need more than five candidates. The number affects work, not
  # correctness: when too few survive, the search widens to the whole index,
  # so a bad guess costs one extra pass and never a short answer.
  candidate_multiplier: 4
  # Sections that hold article titles and URLs rather than content. Matched
  # by exact name: "2. Reference Security Misconfiguration Best Practices"
  # contains the word Reference but is real guidance, and a substring match
  # would throw it away.
  reference_sections:
    - "Reference Links"
    - "References"
    - "Related Articles"
    - "Related Frameworks and Taxonomies"
    # Reciprocal rank fusion adds 1/(rrf_k + position) for each ranking a
    # chunk appears in. The constant decides how much the very top of each
    # list outweighs the rest: smaller favors it more. 60 is the value from
    # the paper the method comes from, kept unchanged - tuning it against
    # eleven queries would fit noise rather than anything real.
  rrf_k: 60