# Source manifest for the GenAI Security Assistant knowledge base.
# One entry = one source document. Raw files live in data/raw/ under `source_file`.
# NOTE: content_hash and retrieved_at are NOT here — the pipeline computes them
# automatically at ingestion time. This file holds only human-authored provenance.

# ---------------------------------------------------------------------------
# Controlled vocabularies (curator-assigned metadata).
# Keep values consistent - they are used later for metadata filtering.
#
# document_type - genre of the source:
#   security_risk: an OWASP Top 10 for LLM risk entry (LLM01..LLM10)
#   cheat_sheet: OWASP Cheat Sheet Series practical guidance
#   checklist: governance / compliance checklist
#
# risk_category — aligned to OWASP Top 10 for LLM Applications 2025:
#   prompt_injection                 (LLM01)   [in use]
#   sensitive_information_disclosure (LLM02)   [in use]
#   supply_chain                     (LLM03)
#   data_and_model_poisoning         (LLM04)
#   improper_output_handling         (LLM05)
#   excessive_agency                 (LLM06)   [in use]
#   system_prompt_leakage            (LLM07)
#   vector_and_embedding_weaknesses  (LLM08)
#   misinformation                   (LLM09)
#   unbounded_consumption            (LLM10)
#   governance : cross-cutting, not one of the 10 OWASP risks  [in use]
#   general    : fallback when no single risk applies
# ---------------------------------------------------------------------------

defaults:
  publisher: "OWASP Gen AI Security Project"
  language: "en"
  domain: "genai_security"
  license: "CC-BY-SA-4.0"

sources:
